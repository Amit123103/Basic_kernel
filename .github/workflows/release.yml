name: Build and Release MyKernel

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm qemu-system-x86 gcc-x86-64-linux-gnu xorriso grub-pc-bin grub-common mtools zip

      - name: Build Kernel ELF
        run: |
          make CC=x86_64-linux-gnu-gcc LD=x86_64-linux-gnu-ld all

      - name: Build Bootable ISO Image
        run: |
          mkdir -p iso/boot/grub
          cp build/mykernel.elf iso/boot/mykernel.elf
          cp boot/grub.cfg iso/boot/grub/grub.cfg
          grub-mkrescue -o build/mykernel.iso iso/

      - name: Prepare Zip Package
        run: |
          VERSION="${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.6' }}"
          mkdir -p release_binaries
          cp build/mykernel.elf release_binaries/mykernel.elf
          cp build/mykernel.iso release_binaries/mykernel.iso
          cp scripts/run-windows.bat release_binaries/run-windows.bat
          cp scripts/run-windows.ps1 release_binaries/run-windows.ps1
          cp scripts/run-macos.sh release_binaries/run-macos.sh
          cp scripts/run-linux.sh release_binaries/run-linux.sh
          chmod +x release_binaries/*.sh
          cd release_binaries && zip -r "../mykernel-${VERSION}.zip" .
          echo "ZIP_PATH=mykernel-${VERSION}.zip" >> $GITHUB_ENV
          echo "RELEASE_VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          files: |
            build/mykernel.elf
            build/mykernel.iso
            scripts/run-windows.bat
            scripts/run-windows.ps1
            scripts/run-macos.sh
            scripts/run-linux.sh
            ${{ env.ZIP_PATH }}
          name: MyKernel ${{ env.RELEASE_VERSION }} Release
          body: |
            ## MyKernel Prebuilt Binary Release (${{ env.RELEASE_VERSION }})

            Directly download prebuilt kernel images and automated launchers for **MyKernel** 64-bit Operating System across **Windows**, **macOS**, and **Linux**.

            ### Downloadable Assets:
            - **`${{ env.ZIP_PATH }}`**: Complete multi-platform bundle containing kernel ELF, bootable ISO, and OS launcher scripts.
            - **`mykernel.elf`**: Precompiled 64-bit ELF kernel image executable.
            - **`mykernel.iso`**: Bootable ISO image compatible with QEMU, VirtualBox, VMware, and physical hardware.
            - **`run-windows.bat` / `run-windows.ps1`**: One-click QEMU launchers for Windows.
            - **`run-macos.sh`**: One-command QEMU launcher for macOS (Apple Silicon & Intel).
            - **`run-linux.sh`**: One-command QEMU launcher for Linux (Ubuntu/Debian, Fedora, Arch).

            ### How to Run by Platform

            #### 🪟 Windows
            1. Install QEMU via PowerShell (if not already installed):
               ```powershell
               winget install SoftwareFreedomConservancy.QEMU
               ```
            2. Double-click `run-windows.bat` or run in PowerShell:
               ```powershell
               .\run-windows.ps1
               ```

            #### 🍎 macOS
            1. Install QEMU via Homebrew:
               ```bash
               brew install qemu
               ```
            2. Run launcher script:
               ```bash
               chmod +x run-macos.sh && ./run-macos.sh
               ```

            #### 🐧 Linux
            1. Install QEMU:
               ```bash
               sudo apt install qemu-system-x86   # Ubuntu/Debian
               ```
            2. Run launcher script:
               ```bash
               chmod +x run-linux.sh && ./run-linux.sh
               ```


